steps:
- task: DownloadSecureFile@1
  name: settingsSecurityXml
  displayName: 'Download maven security settings file'
  inputs:
    secureFile: 'settings-security.xml'
- task: DownloadSecureFile@1
  name: settingsXml
  displayName: 'Download Central publishing settings file'
  inputs:
    secureFile: 'settings-central.xml'
- task: DownloadSecureFile@1
  name: key
  displayName: 'Download private key file'
  inputs:
    secureFile: 'moris.private.asc'
- task: DownloadSecureFile@1
  name: azureconfig
  displayName: 'Download azureconfig file'
  inputs:
    secureFile: 'azureconfig.json'
- script: |
    set -eu
    umask 077
    gpg --no-tty --batch --import "$(key.secureFilePath)"
    mkdir -p "$HOME/.m2"
    cp "$(settingsSecurityXml.secureFilePath)" "$HOME/.m2/settings-security.xml"
    cp "$(settingsXml.secureFilePath)" "$HOME/.m2/settings.xml"
    cp "$(azureconfig.secureFilePath)" "$(Build.SourcesDirectory)/src/test/resources/azureconfig.json"
